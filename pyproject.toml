[build-system]
requires = ['hatchling>=1.26.3', "hatch-fancy-pypi-readme>=24.1.0", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[project]
name = "priorities"
description = "Probability distributions as Equinox records: densities, draws, inverse CDFs and default transforms in JAX"
authors = [{ name = "Corey Spohn", email = "corey.a.spohn@nasa.gov" }]
dynamic = ['readme', 'version']
requires-python = ">=3.12"
license = { file = "LICENSE" }
keywords = ["probability", "prior", "distribution", "JAX", "Equinox"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# The dependency list is part of the scope: tests/test_scope.py pins it.
dependencies = ["jax>=0.8.1", "equinox>=0.13.2"]

[project.optional-dependencies]
dev = ["pre-commit>=3.5.0"]
test = [
    "scipy>=1.15",
    "pytest>=7.3.2",
    "hypothesis>=6.79.1",
    "hwoutils[jax]>=3.0.0",
    "ineedvalidation>=1.0",
    "pytest-xdist>=3.8.0",
    "pytest-testmon>=2.0.7",
    "pytest-markdown-docs>=0.5.0",
    "pytest-timeout>=1.3.1",
    "pytest-fail-slow>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/CoreySpohn/priorities"
Issues = "https://github.com/CoreySpohn/priorities/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/priorities/_version.py"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
# The debug flag is set before the package is imported.
"tests/conftest.py" = ["D", "E402"]
# Each record method implements the AbstractDistribution method of the same name, which
# carries the contract; the record's class docstring states what is specific.
"src/priorities/_records.py" = ["D102"]
"src/priorities/_composite.py" = ["D102"]

[tool.hatch.build.targets.wheel]
packages = ["src/priorities"]

[tool.hatch.build.targets.sdist]
exclude = ["/tests", "/.github"]

[tool.pytest.ini_options]
precision_guard_enforce = true
addopts = "-p hwoutils.testing.precision"
default_precision = "float64"
filterwarnings = ["error"]
testpaths = ["tests"]
markers = [
    "medium: tests with a 30-second default time budget",
    "slow: tests with a 300-second default time budget, run nightly",
]

[tool.testbudget]
library = "priorities"
mode = "report"
unit_s = 5
medium_s = 30
slow_s = 300

[tool.deptry]
known_first_party = ["priorities"]
optional_dependencies_dev_groups = ["dev", "test"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src/priorities"]

# Verification evidence, collected by the ineedvalidation pytest plugin (run with
# --vv-evidence PATH to write the ledger). Explicit @vv.case markers override
# these path defaults.
[tool.ineedvalidation]
library = "priorities"

[tool.ineedvalidation.defaults]
"tests/test_reference.py" = { case = "unit-distributions", evidence = "cross-code-benchmark" }
"tests/test_contract.py" = { case = "unit-distributions", evidence = "code-verification" }
"tests/test_gradients.py" = { case = "unit-distributions", evidence = "code-verification" }
